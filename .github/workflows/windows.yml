name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e .

      - name: Install script
        if: runner.os == 'Linux'
        run: |
          set +e
          bash install.sh
          code=$?
          set -e
          # 1 is the report finding no player, which is allowed on a bare
          # runner; anything above it means the script itself broke.
          test "$code" -le 1

      - name: Compile
        run: python -m compileall -q watch_smthn tests

      - name: Regression suite
        run: python tests/regression.py
